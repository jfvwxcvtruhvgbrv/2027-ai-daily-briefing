name: AI 데일리 발행 (Pages)

# 매일 아침 Claude 예약 작업이 issues/YYYY-MM-DD.json 을 push하면 실행된다.
# 보고서(GitHub Pages) 빌드·배포. 메일 발송은 하지 않는다(사용자 결정, 2026-11-09).
on:
  push:
    branches: [main]
    paths: ["issues/**", "render/**", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 보고서 빌드
        run: python -m render.build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
