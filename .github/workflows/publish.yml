name: AI 데일리 발행

# 매일 아침 Claude 예약 작업이 issues/YYYY-MM-DD.json 을 push하면 실행된다.
# 1) 보고서(GitHub Pages) 빌드·배포  2) 그날 호 메일 발송
on:
  push:
    branches: [main]
    paths: ["issues/**", "render/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      date:
        description: "메일을 다시 보낼 호 날짜 (YYYY-MM-DD, 비우면 메일 없이 사이트만 재배포)"
        required: false
      send:
        description: "메일 발송 여부"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 이번 push의 새 호 찾기
        id: which
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_SEND: ${{ github.event.inputs.send }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATE="$INPUT_DATE"; SEND="$INPUT_SEND"
          else
            DATE=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- issues/ 2>/dev/null \
                   | sed -n 's#^issues/\([0-9-]\{10\}\)\.json$#\1#p' | sort | tail -1)
            SEND=true
            # 오래된 호를 고친 push에는 메일을 다시 보내지 않는다 (오늘·어제 KST만)
            TODAY=$(TZ=Asia/Seoul date +%F); YDAY=$(TZ=Asia/Seoul date -d yesterday +%F)
            if [ -n "$DATE" ] && [ "$DATE" != "$TODAY" ] && [ "$DATE" != "$YDAY" ]; then
              echo "::notice::$DATE 은 오늘·어제 호가 아니라 메일을 보내지 않습니다"; SEND=false
            fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "send=$SEND" >> "$GITHUB_OUTPUT"
          echo "대상 호: ${DATE:-없음}, 메일: $SEND"

      - name: 보고서·메일 빌드
        run: |
          if [ -n "${{ steps.which.outputs.date }}" ]; then
            python -m render.build --email "${{ steps.which.outputs.date }}"
          else
            python -m render.build
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 메일 발송
        if: steps.which.outputs.date != '' && steps.which.outputs.send == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m render.send_email "${{ steps.which.outputs.date }}"
